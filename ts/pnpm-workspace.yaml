packages:
  - packages/*
  - apps/*
  - examples/*

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  koffi: true
  msw: true
  sharp: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - canvas
  - core-js
  - esbuild
  - koffi
  - msw
  - protobufjs
  - sharp

overrides:
  lodash: 4.18.1

packageExtensions:
  '@hookform/resolvers@5.4.0':
    peerDependencies:
      zod: '^3.25.0 || ^4.0.0'
